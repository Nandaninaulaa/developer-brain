services:
  # NOTE: sentence-transformers (used for embeddings) needs real memory —
  # on Windows/Mac, Docker Desktop caps container memory based on its own
  # Settings > Resources > Memory allocation (separate from your machine's
  # total RAM). If backend workers get OOM-killed, raise that allocation
  # to at least 4GB and/or keep WEB_CONCURRENCY=1 below.
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - CHROMA_DIR=/app/data/chroma
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=devbrain123
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-dev-only-change-me}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
    volumes:
      - ./data/chroma:/app/data/chroma
      - sqlite_data:/app/backend/dbdata
    depends_on:
      - neo4j

  neo4j:
    image: neo4j:latest
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/devbrain123
    volumes:
      - ./data/neo4j:/data

volumes:
  chroma_data:
  neo4j_data:
  sqlite_data:
